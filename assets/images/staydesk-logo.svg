<svg width="180" height="40" viewBox="0 0 180 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Icon - Stylized Hotel/Booking Calendar -->
  <defs>
    <linearGradient id="logoGradientMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2d5a8a"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6bb3ff"/>
      <stop offset="100%" stop-color="#8ec5ff"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="2" y="4" width="32" height="32" rx="8" fill="url(#logoGradientMain)" stroke="rgba(107,179,255,0.3)" stroke-width="1"/>
  
  <!-- Building/Hotel icon -->
  <path d="M10 28V16C10 14.8954 10.8954 14 12 14H24C25.1046 14 26 14.8954 26 16V28C26 29.1046 25.1046 30 24 30H12C10.8954 30 10 29.1046 10 28Z" stroke="#6bb3ff" stroke-width="1.5" fill="none"/>
  
  <!-- Top bar (calendar header) -->
  <path d="M10 18H26" stroke="#6bb3ff" stroke-width="1.5"/>
  
  <!-- Calendar pins -->
  <path d="M14 14V11" stroke="#6bb3ff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M22 14V11" stroke="#6bb3ff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Room indicators (dots) -->
  <circle cx="14" cy="22" r="1.5" fill="#6bb3ff"/>
  <circle cx="18" cy="22" r="1.5" fill="#8ec5ff"/>
  <circle cx="22" cy="22" r="1.5" fill="#6bb3ff"/>
  <circle cx="14" cy="26" r="1" fill="#6bb3ff" opacity="0.7"/>
  <circle cx="18" cy="26" r="1" fill="#6bb3ff" opacity="0.7"/>
  <circle cx="22" cy="26" r="1" fill="#6bb3ff" opacity="0.7"/>
  
  <!-- Text: StayDesk -->
  <text x="42" y="27" font-family="'Nunito', sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">
    Stay<tspan fill="url(#accentGradient)">Desk</tspan>
  </text>
</svg>
